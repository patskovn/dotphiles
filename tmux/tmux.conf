unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s

if-shell "test -x /opt/homebrew/bin/fish" "set-option -g default-shell /opt/homebrew/bin/fish; set -g default-command /opt/homebrew/bin/fish" ""
if-shell "test -x /usr/bin/fish" "set-option -g default-shell /usr/bin/fish; set -g default-command /usr/bin/fish" ""

# switch panes using Alt-arrow without prefix
# h
bind -n ˙ select-pane -L
# l
bind -n ¬ select-pane -R
# k
bind -n ˚ select-pane -U
# j
bind -n ∆ select-pane -D

# Option + [
bind -n “ previous-window
# Option + ]
bind -n ‘ next-window

# Option  + -
bind -n – switch-client -p
# Option  + +
bind -n ≠ switch-client -n

set -g mouse on 

set-option -g status-position top

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'patskovn/tmux-catpuccin'
set -g @catppuccin_window_status_style "rounded"
# Flavor tracks the macOS appearance; theme-sync.sh picks between these two.
set -g @catppuccin_dark_flavor 'frappe'
set -g @catppuccin_light_flavor 'latte'
set -g @catppuccin_window_text " #W"
set -g status-left ""

# Session list on top, catppuccin below
set -g status 2
set -g status-format[0] "#(~/.dotfiles/tmux/session-list.sh)#(~/.dotfiles/tmux/theme-sync.sh)"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# tpm has just sourced catppuccin with whatever flavor was set, so apply the one
# matching the current appearance afterwards. Ongoing changes are picked up by
# the theme-sync.sh call in status-format[0].
run-shell "~/.dotfiles/tmux/theme-sync.sh -f"

set-hook -g client-session-changed 'refresh-client -S'
